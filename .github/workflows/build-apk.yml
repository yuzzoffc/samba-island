name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mendukung dua cara: proyek sudah diekstrak di repo, atau cukup satu file .zip di root repo.
      - name: Cari folder proyek
        id: src
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            ZIP=$(ls *.zip | head -n 1)
            unzip -q -o "$ZIP" -d _src
            echo "dir=_src/$(ls _src | head -n 1)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        working-directory: ${{ steps.src.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Siapkan APK
        run: cp "${{ steps.src.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" SAMBA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SAMBA-apk
          path: SAMBA.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SAMBA build ${{ github.run_number }}
          files: SAMBA.apk
